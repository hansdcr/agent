<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent 聊天 - Hans</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 90%;
            max-width: 800px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        .session-info {
            background: #f8f9fa;
            padding: 10px 20px;
            font-size: 12px;
            color: #666;
            border-bottom: 1px solid #e0e0e0;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message.assistant .message-content {
            background: white;
            color: #333;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .chat-input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .chat-input:focus {
            border-color: #667eea;
        }

        .send-button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .send-button:hover {
            transform: scale(1.05);
        }

        .send-button:active {
            transform: scale(0.95);
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #667eea;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            🤖 AI Agent - Hans
        </div>
        <div class="session-info">
            会话ID: <span id="sessionId">加载中...</span>
        </div>
        <div class="chat-messages" id="chatMessages">
            <!-- 消息将在这里显示 -->
        </div>
        <div class="chat-input-container">
            <input
                type="text"
                class="chat-input"
                id="messageInput"
                placeholder="输入消息..."
                onkeypress="handleKeyPress(event)"
            >
            <button class="send-button" onclick="sendMessage()" id="sendButton">
                发送
            </button>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8000/api';
        let currentSessionId = null;

        // 页面加载时初始化
        window.onload = async function() {
            console.log('页面加载完成，开始初始化...');

            // 从 localStorage 获取 session_id
            currentSessionId = localStorage.getItem('chat_session_id');
            console.log('从 localStorage 读取 session_id:', currentSessionId);

            if (currentSessionId) {
                // 如果有 session_id，加载历史消息
                console.log('检测到 session_id，开始加载历史消息...');
                await loadChatHistory(currentSessionId);
            } else {
                // 如果没有，显示欢迎消息
                console.log('没有 session_id，显示欢迎消息');
                addMessage('assistant', '你好！我是 Hans，很高兴为你服务。');
            }

            updateSessionDisplay();
            console.log('初始化完成');
        };

        // 加载聊天历史
        async function loadChatHistory(sessionId) {
            console.log('loadChatHistory 被调用，session_id:', sessionId);
            try {
                const url = `${API_BASE_URL}/chat/history/${sessionId}`;
                console.log('请求 URL:', url);

                const response = await fetch(url);
                console.log('响应状态:', response.status);

                const result = await response.json();
                console.log('响应数据:', result);

                if (result.code === 200 && result.data.messages.length > 0) {
                    // 清空消息区域
                    document.getElementById('chatMessages').innerHTML = '';

                    // 显示历史消息
                    result.data.messages.forEach(msg => {
                        addMessage(msg.role, msg.content, false);
                    });

                    console.log(`✓ 已加载 ${result.data.messages.length} 条历史消息`);
                } else {
                    // 没有历史消息，显示欢迎消息
                    console.log('没有历史消息，显示欢迎消息');
                    addMessage('assistant', '你好！我是 Hans，很高兴为你服务。');
                }
            } catch (error) {
                console.error('❌ 加载历史消息失败:', error);
                addMessage('assistant', '你好！我是 Hans，很高兴为你服务。');
            }
        }

        // 更新会话ID显示
        function updateSessionDisplay() {
            const sessionIdElement = document.getElementById('sessionId');
            if (currentSessionId) {
                sessionIdElement.textContent = currentSessionId.substring(0, 8) + '...';
            } else {
                sessionIdElement.textContent = '新会话';
            }
        }

        // 添加消息到界面
        function addMessage(role, content, scroll = true) {
            const messagesContainer = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;

            messageDiv.appendChild(contentDiv);
            messagesContainer.appendChild(messageDiv);

            if (scroll) {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }
        }

        // 发送消息
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message) return;

            // 禁用输入和按钮
            input.disabled = true;
            const sendButton = document.getElementById('sendButton');
            sendButton.disabled = true;
            sendButton.textContent = '发送中...';

            // 显示用户消息
            addMessage('user', message);
            input.value = '';

            try {
                // 发送请求
                const response = await fetch(`${API_BASE_URL}/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        session_id: currentSessionId
                    })
                });

                const result = await response.json();

                if (result.code === 200) {
                    // 保存 session_id
                    if (!currentSessionId) {
                        currentSessionId = result.data.session_id;
                        localStorage.setItem('chat_session_id', currentSessionId);
                        updateSessionDisplay();
                    }

                    // 显示 AI 回复
                    addMessage('assistant', result.data.message);
                } else {
                    addMessage('assistant', '抱歉，发生了错误：' + result.message);
                }
            } catch (error) {
                console.error('发送消息失败:', error);
                addMessage('assistant', '抱歉，网络连接失败，请稍后重试。');
            } finally {
                // 恢复输入和按钮
                input.disabled = false;
                sendButton.disabled = false;
                sendButton.textContent = '发送';
                input.focus();
            }
        }

        // 处理回车键
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // 清除会话（可选功能）
        function clearSession() {
            if (confirm('确定要开始新的会话吗？当前会话历史将被保留，但会创建新的会话。')) {
                localStorage.removeItem('chat_session_id');
                currentSessionId = null;
                document.getElementById('chatMessages').innerHTML = '';
                addMessage('assistant', '你好！我是 Hans，很高兴为你服务。');
                updateSessionDisplay();
            }
        }
    </script>
</body>
</html>
